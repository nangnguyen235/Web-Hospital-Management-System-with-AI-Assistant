# NGINX trên EC2 — 5-trien-khai-cicd/vps-cloudflare-cicd.md mục 1.
# Cloudflare (SSL Full Strict) → NGINX 443 (chứng chỉ Origin CA) → backend:8080.

# Phân giải lại tên "backend" mỗi 10 giây: deploy tạo container mới (IP mới) không làm NGINX trả 502.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    location = /nginx-health {
        access_log off;
        return 200 "ok";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.nangnguyen.me;

    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;

    # Ghi âm Voice-to-EMR tối đa 20 MB (NFR-04)
    client_max_body_size 25m;

    location / {
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_http_version 1.1;          # HTTP/1.0 mặc định làm Kestrel từ chối POST không body
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # gọi LLM có thể chậm
    }
}
