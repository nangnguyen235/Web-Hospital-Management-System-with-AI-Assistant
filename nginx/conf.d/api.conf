# NGINX trên VPS (DigitalOcean Droplet) — 5-trien-khai-cicd/vps-cloudflare-cicd.md mục 1.
# Cloudflare (SSL Full Strict) → NGINX 443 (chứng chỉ Origin CA) → backend:8080 (Spring Boot).

# Phân giải lại tên "backend" mỗi 10 giây: deploy tạo container mới (IP mới) không làm NGINX trả 502.
resolver 127.0.0.11 valid=10s ipv6=off;

# IP thật của người dùng: Cloudflare gửi trong CF-Connecting-IP (https://www.cloudflare.com/ips-v4, lấy 2026-11-11).
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
real_ip_header CF-Connecting-IP;

server_tokens off;

server {
    listen 80;
    server_name _;

    location = /nginx-health {
        access_log off;
        return 200 "ok";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Host lạ (quét IP trực tiếp) → đóng kết nối, không lộ backend.
server {
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    return 444;
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.nangnguyen.me;

    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:5m;

    # Ghi âm Voice-to-EMR tối đa 20 MB, kết quả xét nghiệm 10 MB (NFR-04)
    client_max_body_size 25m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types application/json application/problem+json text/plain;

    location / {
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
