# CI cho mỗi Pull Request vào main: đỏ thì không merge (5-trien-khai-cicd/vps-cloudflare-cicd.md mục 5).
name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (.NET build + test + architecture test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore HIS.ModularMonolith.sln
      - run: dotnet build HIS.ModularMonolith.sln -c Release --no-restore
      - run: dotnet test HIS.ModularMonolith.sln -c Release --no-build --logger "console;verbosity=normal"

  frontend:
    name: Frontend (lint + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
