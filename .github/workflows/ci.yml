# CI cho mọi Pull Request vào main/baseline và mỗi lần main thay đổi: đỏ thì không merge.
# CHỈ kiểm thử, KHÔNG deploy — deploy lên VPS + Pages chỉ chạy từ nhánh baseline (deploy.yml).
name: CI

on:
  pull_request:
    branches: [main, baseline]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Maven verify — unit, Modulith, ArchUnit, Testcontainers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: chmod +x mvnw && ./mvnw -B verify
      - name: Lưu sơ đồ module (Spring Modulith) cho báo cáo
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: so-do-module
          path: backend/his-app/target/spring-modulith-docs
          if-no-files-found: ignore

  frontend:
    name: Frontend (lint + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
