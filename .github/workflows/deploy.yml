# Deploy khi push main: test → build 1 image backend → GHCR → SSH vào EC2 → compose pull/up.
# Secret cần có: EC2_HOST (IP hiện tại), EC2_USER, EC2_SSH_KEY. Đăng nhập GHCR bằng GITHUB_TOKEN.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/nangnguyen235/his-backend

jobs:
  test:
    name: Test lại trước khi deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore HIS.ModularMonolith.sln
      - run: dotnet build HIS.ModularMonolith.sln -c Release --no-restore
      - run: dotnet test HIS.ModularMonolith.sln -c Release --no-build

  image:
    name: Build và push image lên GHCR
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy lên EC2
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Copy compose.yaml và cấu hình NGINX lên /opt/his
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "compose.yaml,nginx/conf.d,scripts/backup-mysql.sh"
          target: /opt/his
      - name: Kéo image mới và khởi động lại
        uses: appleboy/ssh-action@v1.2.5
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            cd /opt/his
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose pull
            docker compose up -d --remove-orphans
            docker logout ghcr.io
            docker image prune -f
            for i in $(seq 1 36); do
              STATUS=$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q backend)")
              if [ "$STATUS" = "healthy" ]; then echo "backend healthy"; exit 0; fi
              sleep 5
            done
            docker compose logs --tail 100 backend
            exit 1
