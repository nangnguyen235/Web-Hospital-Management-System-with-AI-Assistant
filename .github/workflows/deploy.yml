# Deploy CHỈ từ nhánh baseline (bản triển khai chính thức): test → image backend → GHCR → SSH EC2 → compose pull/up;
# frontend build → Cloudflare Pages (Direct Upload). Nhánh main chỉ chạy CI, không ảnh hưởng VPS.
# Secret: EC2_HOST (IP hiện tại), EC2_USER, EC2_SSH_KEY, CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID. GHCR dùng GITHUB_TOKEN.
name: Deploy

on:
  push:
    branches: [baseline]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/nangnguyen235/his-backend

jobs:
  test:
    name: Test lại trước khi deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: chmod +x mvnw && ./mvnw -B verify

  frontend:
    name: Frontend → Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Lint, test, build
        working-directory: frontend
        env:
          VITE_API_URL: https://api.nangnguyen.me
        run: |
          npm ci
          npm run lint
          npm run test
          npm run build
      - name: Đẩy dist lên Pages (project thehos, nhánh production)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy frontend/dist --project-name=thehos --branch=main --commit-dirty=true

  image:
    name: Build và push image lên GHCR
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy lên EC2
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Copy compose.yaml và cấu hình NGINX lên /opt/his
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "compose.yaml,nginx/conf.d,scripts/backup-mysql.sh"
          target: /opt/his
      - name: Kéo image mới và khởi động lại
        uses: appleboy/ssh-action@v1.2.5
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            cd /opt/his
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose pull
            docker compose up -d --remove-orphans
            docker compose restart nginx   # nạp lại nginx/conf.d vừa copy (image nginx không đổi thì up không tạo lại)
            docker logout ghcr.io
            docker image prune -f
            # JVM khởi động + Flyway: chờ tối đa 3 phút
            for i in $(seq 1 36); do
              CID=$(docker compose ps -q backend || true)
              STATUS=$( [ -n "$CID" ] && docker inspect -f '{{.State.Health.Status}}' "$CID" || echo "khong-co-container")
              if [ "$STATUS" = "healthy" ]; then echo "backend healthy"; exit 0; fi
              sleep 5
            done
            echo "backend chưa healthy (trạng thái: $STATUS)"
            docker compose ps
            docker compose logs --tail 150 backend
            exit 1
