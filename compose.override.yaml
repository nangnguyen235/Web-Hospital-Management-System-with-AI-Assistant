# CHỈ dùng ở máy dev (docker compose tự nạp file này). Pipeline KHÔNG copy file này lên EC2.
services:
  backend:
    build: ./backend
    image: his-backend:dev
    environment:
      HIS_SWAGGER_ENABLED: "true"                                 # Swagger: http://localhost/swagger-ui.html
      HIS_CORS_ALLOWED_ORIGINS: "http://localhost:5173"
  nginx:
    volumes:
      - ./nginx/dev:/etc/nginx/conf.d:ro    # chỉ cổng 80, không cần chứng chỉ Origin CA
  mysql:
    ports:
      - "127.0.0.1:3317:3306"               # chạy backend từ IDE: jdbc:mysql://localhost:3317/his (tránh 3306/3307 hay bị chiếm)
